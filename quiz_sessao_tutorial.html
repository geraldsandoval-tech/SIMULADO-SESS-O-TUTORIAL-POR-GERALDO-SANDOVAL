<style>
:root{--bg:#f3f6fb;--surface:#fff;--ink:#0f1c3a;--muted:#4a5b7a;--line:#d6deeb;--wine:#1b2f5c;--wine-soft:#e7ecf5;--olive:#3d5a80;--olive-soft:#edf1f6;--hero:#0f1c3a;--hero-ink:#eef3fb;--pill:#e7ecf5;--ok:#2f6b4f;--ok-soft:#e6f2ec;--no:#9b3232;--no-soft:#f8e9e9;
--serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1328;--surface:#111c36;--ink:#e6ecf7;--muted:#9fb0cc;--line:#22314f;--wine:#9db7e6;--wine-soft:#1c2740;--olive:#a9bfdc;--olive-soft:#1f2838;--hero:#070e1f;--pill:#1a2744;--ok:#7fcfa4;--ok-soft:#14302a;--no:#f0a0a0;--no-soft:#3a1c24}}
:root[data-theme="dark"]{--bg:#0b1328;--surface:#111c36;--ink:#e6ecf7;--muted:#9fb0cc;--line:#22314f;--wine:#9db7e6;--wine-soft:#1c2740;--olive:#a9bfdc;--olive-soft:#1f2838;--hero:#070e1f;--pill:#1a2744;--ok:#7fcfa4;--ok-soft:#14302a;--no:#f0a0a0;--no-soft:#3a1c24}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
header{background:var(--hero);color:var(--hero-ink);padding:34px 20px 30px}
.wrap{max-width:780px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font:600 clamp(2rem,5vw,3rem)/1.05 var(--serif);margin:0}
.sub{margin:10px 0 0;opacity:.78;font-size:.95rem}
.tools{display:flex;gap:8px;flex-shrink:0}
.ghost{background:transparent;border:1px solid rgba(238,243,251,.3);color:var(--hero-ink);border-radius:999px;padding:6px 14px;font-size:.85rem}
.ghost:hover{border-color:var(--hero-ink)}
main{padding:22px 16px 40px}
.stats{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
.stats b{color:var(--ink)}.stats .sp{flex:1}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--olive);width:0;transition:width .3s}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 14px 30px -18px rgba(15,28,58,.35);padding:24px clamp(16px,4vw,32px)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{border-radius:999px;background:var(--pill);color:var(--wine);font-size:.8rem;font-weight:600;padding:3px 11px}
.pill.b{background:var(--olive-soft);color:var(--olive)}
.pill.d{background:transparent;border:1px solid var(--line);color:var(--muted)}
.qn{font:italic 500 1.05rem var(--serif);color:var(--muted);margin:0 0 6px}
.stem{margin:0 0 10px;font-size:1.02rem}
.cmd{margin:0 0 18px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45;transition:transform .15s,border-color .15s}
.opt:not(:disabled):hover{transform:translateY(-2px);border-color:var(--olive)}
.opt:disabled{cursor:default}
.opt .l{flex-shrink:0;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--wine-soft);color:var(--wine);font-weight:700;font-size:.85rem}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .l{background:var(--ok);color:var(--surface)}
.opt.no{border-color:var(--no);background:var(--no-soft)}.opt.no .l{background:var(--no);color:var(--surface)}
.fb{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.verdict{font:600 1.15rem var(--serif);margin:0 0 10px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.fb h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
.fb p{margin:0}.fb ul{margin:4px 0 0;padding-left:18px}
.fb li{margin:5px 0;color:var(--muted)}.fb li b{color:var(--ink)}
.bl{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--olive-soft);font-size:.92rem;color:var(--muted)}
.bl b{color:var(--olive)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--olive)}
.btn.pri{background:var(--wine);border-color:var(--wine);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.res h2{font:600 clamp(1.7rem,4vw,2.4rem)/1.1 var(--serif);margin:0 0 6px}
.res h3{font:600 1.15rem var(--serif);margin:22px 0 8px}
.big{font:700 clamp(3rem,10vw,4.6rem)/1 var(--serif);color:var(--wine);margin:18px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.grid div{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.grid span{display:block;font-size:.82rem;color:var(--muted)}.grid b{font-size:1.4rem}
.tb{width:100%;border-collapse:collapse;font-size:.92rem}
.tb td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tb td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.rev .card{margin-bottom:16px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 30px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// Níveis da taxonomia de Bloom (revisada)
const BL={Compreender:"explicar ou reconhecer o significado de um achado ou conceito dentro de uma situação.",Aplicar:"usar o conhecimento para decidir diagnóstico ou conduta em um caso novo.",Analisar:"separar os dados do caso e diferenciar diagnósticos que se parecem.",Avaliar:"julgar qual conduta é mais adequada entre opções plausíveis, pesando riscos e características do paciente."};
// [tema, Bloom, dificuldade, vinheta, comando, [alternativas], correta, explicação, [motivo de erro por alternativa, "" na correta]]
const Q=[
["Tratamento","Avaliar","Difícil","Homem de 63 anos comparece à UBS acompanhado da esposa. Refere que, há cerca de 8 meses, vive preocupado com as finanças, a saúde e o trabalho; reconhece que a preocupação é exagerada e diz não conseguir controlá-la. Relata tensão muscular, irritabilidade e sono ruim, e deixou de frequentar o grupo da igreja. Teve infarto agudo do miocárdio há 2 anos e tem eletrocardiograma recente com distúrbio de condução, acompanhado pelo cardiologista. PA 128 x 82 mmHg; FC 68 bpm. TSH normal.","Considerando o diagnóstico mais provável e o perfil do paciente, qual é a conduta farmacológica inicial mais adequada?",["Iniciar sertralina em dose baixa, com titulação gradual","Iniciar imipramina em dose baixa, com titulação gradual","Iniciar pregabalina 75 mg de 8/8 horas","Iniciar clonazepam contínuo como tratamento de base"],0,"O quadro fecha TAG: preocupação excessiva por ≥6 meses, difícil de controlar, ≥3 dos 6 sintomas, prejuízo funcional e hipertireoidismo excluído. Sertralina, escitalopram ou paroxetina são a primeira linha do TAG. No cardiopata, o ISRS ainda evita o principal problema dos tricíclicos: os distúrbios da condução cardíaca.",["","Tricíclicos causam distúrbios da condução cardíaca e hipotensão ortostática — justamente o que se quer evitar neste paciente — e não fazem parte do esquema do TAG.","Pregabalina é terceira linha no TAG; não se pula a primeira linha.","Benzodiazepínico é tarja preta, gera dependência e serve como ponte curta (≈1 mês) em crise, não como tratamento de base."]],
["Tratamento","Avaliar","Intermediária","Mulher de 34 anos, em acompanhamento na UBS por transtorno depressivo maior, usa paroxetina 20 mg/dia há 10 semanas. Relata melhora importante do humor, do sono e da disposição. Refere, porém, queda acentuada da libido e anorgasmia desde o início do tratamento, o que tem gerado conflito com o parceiro, e afirma que vai parar o remédio se isso continuar. IMC 34 kg/m²; está em programa de perda de peso. Nega insônia.","Com base no perfil de efeitos colaterais dos antidepressivos estudado, qual é a troca mais adequada?",["Substituir a paroxetina por bupropiona","Substituir a paroxetina por clomipramina","Substituir a paroxetina por mirtazapina","Substituir a paroxetina por sertralina"],0,"A paroxetina tem a maior pontuação de disfunção sexual entre os ISRS da tabela. A bupropiona (primeira linha, grupo “outros”) não tem disfunção sexual nem ganho de peso assinalados; seu efeito mais marcante é a insônia, que a paciente não tem.",["","A clomipramina tem a maior pontuação de disfunção sexual da tabela, além de ganho de peso importante.","A mirtazapina não pontua disfunção sexual, mas tem o maior escore de ganho de peso — inadequado para paciente obesa em programa de perda de peso.","A sertralina é ISRS; a classe tem ↓ libido e anorgasmia entre os efeitos típicos, e ela também pontua disfunção sexual na tabela."]],
["Tratamento","Aplicar","Difícil","Mulher de 46 anos, professora, retorna ao ambulatório com diagnóstico de TAG há 1 ano. Mantém preocupação excessiva e difícil de controlar, fadiga e mialgias difusas que pioram nos períodos de maior ansiedade. Usou sertralina e, em seguida, escitalopram, ambos em dose e tempo adequados e com boa adesão, sem resposta satisfatória. Exame físico sem alterações; TSH normal.","Considerando o escalonamento terapêutico do TAG apresentado no material, qual é a conduta mais adequada?",["Iniciar duloxetina, na faixa de 30 a 120 mg/dia","Iniciar buspirona 5 mg de 8/8 horas","Iniciar clomipramina, na faixa de 25 a 150 mg/dia","Manter clonazepam contínuo e suspender os antidepressivos"],0,"Após falha da primeira linha (ISRS), a segunda linha do TAG é venlafaxina ou duloxetina, ambas IRSN. A queixa de mialgia não muda o raciocínio: a escolha se sustenta pelo escalonamento do TAG descrito no material.",["","Buspirona é terceira linha do TAG, usada só após falha da segunda linha.","Clomipramina é segunda linha do transtorno de pânico, não do TAG.","Benzodiazepínico não é tratamento de manutenção: gera dependência e deve ser retirado quando o antidepressivo age."]],
["Tratamento","Avaliar","Difícil","Homem de 79 anos, viúvo há 1 ano, é trazido pela filha à UBS. Há 2 meses está triste na maior parte do dia, desinteressado pelas atividades, com dificuldade para iniciar o sono, inapetência com perda de 5 kg e fadiga. Nega episódios prévios de euforia ou redução da necessidade de sono. Hemograma, TSH, glicemia, função renal e hepática sem alterações.","Qual é a prescrição inicial mais adequada para este paciente?",["Mirtazapina 15 mg à noite","Bupropiona 150 mg pela manhã","Fluoxetina 20 mg pela manhã","Venlafaxina 150 mg pela manhã"],0,"A mirtazapina tem sedação marcada e o maior escore de ganho de peso da tabela — efeitos usados a favor da insônia e da inapetência. A dose inicial no idoso é 15 mg (no adulto, 30 mg).",["","A bupropiona tem o maior escore de insônia da tabela e não favorece ganho de peso — pioraria o sono.","A fluoxetina pontua insônia e náusea, e os ISRS podem reduzir o apetite; além disso, a dose inicial no idoso é 10 mg.","A venlafaxina pontua insônia e muita náusea, e 150 mg é a dose habitual do adulto (inicial no idoso: 37,5 mg)."]],
["Tratamento","Avaliar","Intermediária","Mulher de 41 anos procura a UBS com transtorno depressivo maior grave. Há 3 semanas iniciou amitriptilina 25 mg à noite, prescrita em outro serviço “para ajudar no sono”. Na consulta atual, relata ideação suicida recorrente com plano; após avaliação de segurança, fica decidido o seguimento próximo com a família. Mantém insônia e perda de apetite.","Em relação ao antidepressivo, qual é a conduta mais adequada?",["Substituir a amitriptilina por mirtazapina","Aumentar a amitriptilina até a dose habitual","Substituir a amitriptilina por nortriptilina","Manter a amitriptilina e associar imipramina"],0,"Tricíclicos (amitriptilina, nortriptilina, imipramina, clomipramina) devem ser evitados em pacientes com risco de suicídio. A mirtazapina é primeira linha sem essa ressalva e sua sedação e ganho de peso ajudam na insônia e na inapetência.",["","Aumentar a dose mantém a paciente com risco de suicídio em uso de tricíclico.","A nortriptilina também é tricíclico — mesma restrição.","Associar outro tricíclico agrava o problema."]],
["Tratamento","Aplicar","Intermediária","Homem de 38 anos, bancário, com transtorno depressivo maior moderado, usa sertralina em dose efetiva há 8 semanas, com boa adesão. Relata melhora parcial do humor e da energia, mas persistem anedonia e alteração do sono. Nega sintomas maníacos ou hipomaníacos atuais ou prévios; exames laboratoriais normais.","Qual é a próxima estratégia terapêutica mais adequada?",["Associar um segundo fármaco, preferencialmente de outra classe","Suspender a sertralina e iniciar outro ISRS em dose inicial","Suspender o antidepressivo e reavaliar o diagnóstico","Substituir por benzodiazepínico de manutenção"],0,"O tratamento começa em monoterapia, em dose efetiva, por pelo menos 8 semanas. Com resposta parcial, associa-se outro fármaco, preferencialmente de outra classe. O lítio é opção de potencialização quando não há controle com antidepressivos.",["","Diante de resposta parcial após 8 semanas em dose efetiva, o passo previsto é associar, não recomeçar do zero.","Resposta parcial não invalida o diagnóstico; a conduta prevista é associação ou potencialização.","Benzodiazepínico não trata o TDM e não é tratamento de manutenção."]],
["Tratamento","Aplicar","Intermediária","Mulher de 27 anos recebe diagnóstico de transtorno do pânico no ambulatório. Tem crises quase diárias, com palpitação, sudorese e medo de morrer, e está muito angustiada. O médico decide iniciar sertralina e explica que o efeito não é imediato.","Qual é o plano terapêutico mais adequado para o início do tratamento?",["Sertralina + clonazepam sublingual se necessário por cerca de 1 mês, com retirada progressiva","Clonazepam em monoterapia contínua, sem necessidade de antidepressivo","Sertralina + clonazepam, com suspensão abrupta do benzodiazepínico em 1 semana","Clomipramina como primeira escolha, sem associação"],0,"O ISRS leva ≈2–4 semanas para agir; o clonazepam sublingual (receita azul tipo B) serve de ponte nas crises, geralmente por até 1 mês. Quando o ISRS faz efeito, o benzodiazepínico é retirado aos poucos — nunca de forma abrupta, pelo risco de rebote e abstinência.",["","Benzodiazepínico isolado e prolongado gera dependência; não é tratamento definitivo.","A retirada deve ser gradual, e em 1 semana o ISRS ainda não começou a agir.","No pânico, clomipramina é segunda linha; a primeira é sertralina, escitalopram ou citalopram."]],
["Tratamento","Aplicar","Intermediária","Homem de 30 anos, sem comorbidades cardiovasculares e com eletrocardiograma normal, tem transtorno do pânico há 1 ano. Usou sertralina e, depois, escitalopram, ambos em dose e tempo adequados e com boa adesão, sem controle das crises.","Segundo a tabela de tratamento estudada, qual é a próxima opção farmacológica?",["Imipramina","Venlafaxina","Buspirona","Pregabalina"],0,"No pânico, a segunda linha é clomipramina ou imipramina (25 a 150 mg). Sem cardiopatia, a ressalva dos tricíclicos sobre condução cardíaca não impede a escolha.",["","Venlafaxina é segunda linha no TAG e na fobia social, não no pânico.","Buspirona é terceira linha do TAG.","Pregabalina é terceira linha do TAG."]],
["Tratamento","Aplicar","Intermediária","Mulher de 36 anos, com TAG, está assintomática após 3 meses de escitalopram em dose terapêutica. Retorna à UBS dizendo que está “curada” e quer parar a medicação, pois não gosta de depender de remédio.","Qual é a orientação mais adequada?",["Manter a dose terapêutica por 9 a 12 meses e depois considerar redução gradual","Suspender a medicação, pois houve remissão completa dos sintomas","Reduzir a dose pela metade e manter indefinidamente","Substituir por pregabalina na fase de manutenção"],0,"O tratamento é intensificado até alívio satisfatório e mantido na dose terapêutica por 9–12 meses; depois, pode-se considerar redução gradual.",["","Suspender com 3 meses contraria a manutenção de 9–12 meses.","O material propõe manter a dose terapêutica e depois reduzir gradualmente, não meia dose indefinida.","Pregabalina é terceira linha e não houve falha terapêutica."]],
["Tratamento","Avaliar","Difícil","Mulher de 23 anos procura a UBS por humor deprimido, hipersonia e aumento do apetite há 3 semanas. Ao ser investigada, relata que há 1 ano passou 5 dias dormindo 3 horas por noite e se sentindo descansada, falando sem parar e fazendo compras acima do padrão, sem prejuízo importante no trabalho e sem necessidade de internação. Nega sintomas psicóticos.","Qual é a conduta terapêutica mais adequada?",["Iniciar estabilizador (lamotrigina ou quetiapina), sem antidepressivo isolado","Iniciar amitriptilina à noite, aproveitando o efeito sobre o sono","Iniciar fluoxetina em monoterapia e reavaliar em 8 semanas","Iniciar fluoxetina e associar estabilizador apenas se surgir mania"],0,"Em todo paciente deprimido deve-se investigar mania/hipomania. O episódio prévio (≥4 dias, sem psicose, sem prejuízo acentuado, sem internação) é hipomania → TB tipo II. Antidepressivo em monoterapia pode precipitar switch maníaco; se usado, deve vir com estabilizador. Lamotrigina e quetiapina são primeira linha no episódio depressivo bipolar.",["","Tricíclicos têm maior risco de virada maníaca — a pior escolha num quadro bipolar.","Antidepressivo em monoterapia num paciente bipolar é o cenário clássico de switch maníaco.","O estabilizador deve fazer parte do tratamento desde o início; esperar a mania expõe a paciente ao switch."]],
["Terminologia","Analisar","Intermediária","Homem de 22 anos é avaliado no ambulatório de saúde mental. Durante a entrevista, interrompe subitamente uma frase e permanece em silêncio por alguns segundos. Questionado, diz: “O pensamento sumiu, como se alguém tivesse tirado da minha cabeça”. Em seguida retoma a conversa, sem aceleração do discurso.","Qual alteração do curso do pensamento está descrita?",["Interceptação (bloqueio) do pensamento","Fuga de ideias","Mutismo","Tenacidade"],0,"Interrupção súbita do fluxo do pensamento, com a sensação de que algo o “tirou”, é interceptação — na prática usada como sinônimo de bloqueio. O silêncio é episódico e acompanha o bloqueio.",["","Fuga de ideias é passagem rápida de um pensamento a outro, com associações aceleradas: há excesso de fluxo, não interrupção.","Mutismo é ausência ou redução importante da fala; aqui o silêncio é episódico, durante o bloqueio.","Tenacidade é persistência excessiva num mesmo conteúdo, com dificuldade de mudar o foco."]],
["Terminologia","Compreender","Básica","Mulher de 30 anos é atendida no CAPS. Com um leve sorriso e tom tranquilo, conta que o pai morreu na semana anterior e que a casa da família foi destruída em um incêndio. O examinador registra que a expressão emocional não acompanha a gravidade do relato.","Qual termo descreve corretamente o achado do exame psíquico?",["Afeto inadequado","Embotamento afetivo","Neotimia","Disforia"],0,"Afeto inadequado é a expressão emocional incompatível com o conteúdo ou o contexto — como sorrir ao relatar acontecimentos familiares graves.",["","No embotamento há redução da intensidade da expressão, com pouca variação facial e vocal, não uma expressão incongruente como sorrir.","Neotimia é vivenciar sentimentos novos e estranhos, difíceis de nomear.","Disforia é estado emocional desagradável (mal-estar, irritabilidade, angústia)."]],
["Terminologia","Analisar","Intermediária","Homem de 25 anos é levado pela mãe à UBS. Afirma que o apresentador do telejornal “manda recados só para ele” e que postagens aleatórias nas redes sociais foram escritas pensando nele. Questionado, nega que alguém queira prejudicá-lo, vigiá-lo ou ameaçá-lo.","Qual alteração do conteúdo do pensamento é descrita especificamente?",["Ideias de referência","Ideias persecutórias","Delírio místico/religioso","Autoculpabilidade"],0,"Interpretar acontecimentos ou mensagens neutras (TV, redes sociais) como tendo significado pessoal e especial é ideia de referência.",["","Ideias persecutórias envolvem ser perseguido, vigiado, ameaçado ou prejudicado — o paciente nega isso.","Delírio místico envolve religião, divindade, missão espiritual ou poderes sobrenaturais.","Autoculpabilidade é a convicção de ser culpado por acontecimentos negativos."]],
["Terminologia","Compreender","Intermediária","Estudante de 20 anos, afastada da faculdade há 6 meses, é atendida no ambulatório. Diz: “Quero muito voltar a estudar, mas ao mesmo tempo sinto que não posso sair de casa”. Descreve o desejo de voltar e a sensação oposta como simultâneas e igualmente intensas.","Qual termo psicopatológico descreve essa vivência?",["Ambivalência","Avolição","Anedonia","Retraimento social"],0,"Ambivalência é a presença simultânea de sentimentos, pensamentos ou tendências volitivas opostas em relação ao mesmo objeto ou situação.",["","Avolição é dificuldade de iniciar atividades dirigidas a objetivos; aqui existe o desejo, só que em conflito com a tendência oposta.","Anedonia é perda da capacidade de sentir prazer ou interesse; a paciente relata interesse.","Retraimento social é redução do contato com pessoas; pode coexistir, mas não descreve o conflito entre tendências opostas."]],
["Transtorno bipolar","Analisar","Intermediária","Homem de 31 anos, com dois episódios depressivos maiores prévios, conta na consulta que, há 2 meses, passou 5 dias com humor expansivo, autoestima inflada, necessidade de sono reduzida e fala acelerada. Continuou trabalhando normalmente, não teve sintomas psicóticos e não precisou de internação. A esposa confirma a mudança de comportamento.","Qual é o diagnóstico mais provável?",["Transtorno bipolar tipo II","Transtorno bipolar tipo I","Ciclotimia","Transtorno depressivo maior recorrente"],0,"Episódio de ≥4 dias, humor expansivo + ≥3 sintomas, sem psicose, sem prejuízo acentuado e sem internação é hipomania. Hipomania + depressão = TB tipo II.",["","TB tipo I exige episódio maníaco (≥7 dias, ou menos se houver internação ou psicose), com prejuízo importante.","Na ciclotimia, os critérios de episódio depressivo maior e hipomaníaco nunca são satisfeitos — aqui foram.","O TDM exige que nunca tenha havido episódio maníaco ou hipomaníaco."]],
["Transtorno bipolar","Avaliar","Difícil","Mulher de 52 anos, com transtorno bipolar tipo I estável há 3 anos em uso de carbonato de lítio, iniciou diurético para hipertensão há 10 dias. Há 2 dias apresenta vômitos e diarreia após gastroenterite. É trazida ao pronto-socorro com tremores, náuseas intensas e marcha atáxica. Está desidratada, sem sintomas de humor.","Qual é a hipótese e a conduta mais adequadas?",["Intoxicação por lítio: hidratar e, em geral, suspender o lítio","Hipotireoidismo pelo lítio: manter a dose e reavaliar","Nova fase maníaca: aumentar o lítio para 1.800 mg/dia","Efeito adverso benigno: manter tudo e reavaliar em 6 meses"],0,"O lítio tem excreção renal e índice terapêutico estreito; diuréticos e desidratação elevam a litemia e levam à toxicidade (náusea, vômito, diarreia, ataxia). O manejo é hidratação e, geralmente, suspensão do medicamento.",["","Hipotireoidismo é efeito endócrino do lítio, mas não explica ataxia aguda após desidratação e diurético.","Não há sintomas maníacos; aumentar a dose agravaria a toxicidade.","Ataxia com vômitos e diarreia em uso de lítio sinaliza toxicidade e exige ação imediata."]],
["Depressão","Analisar","Intermediária","Homem de 45 anos procura a UBS. Há 3 semanas perdeu o interesse pelo futebol e pela família, dorme mal quase todos os dias, sente-se cansado, tem dificuldade de concentração e culpa excessiva por “ser um peso”. Nega sentir-se triste. Não usa substâncias, os exames clínicos são normais e nunca teve episódios de mania ou hipomania. Foi advertido no trabalho por queda de desempenho.","Qual é a interpretação diagnóstica correta?",["Preenche episódio depressivo maior, com 5 sintomas incluindo anedonia","Não preenche, porque o humor deprimido é obrigatório","Não preenche, porque são exigidos pelo menos 30 dias de sintomas","Preenche transtorno depressivo persistente (distimia)"],0,"São necessários ≥5 dos 9 sintomas no mesmo período de 2 semanas, sendo pelo menos um humor deprimido OU anedonia. Aqui: anedonia, insônia, fadiga, ↓ concentração e culpa (5), por 3 semanas, com prejuízo e exclusões feitas.",["","Basta humor deprimido ou anedonia — um dos dois.","O critério temporal é de 2 semanas.","Distimia exige humor deprimido crônico por pelo menos 2 anos."]],
["Depressão","Analisar","Difícil","Mulher de 19 anos procura a UBS com o terceiro episódio depressivo desde os 16 anos. Dorme cerca de 12 horas por dia e ainda sente sonolência diurna, ganhou 6 kg com aumento do apetite e descreve o corpo “pesado como chumbo”. O pai tem transtorno bipolar. Ela nega, até o momento, episódios de euforia.","Quais elementos do caso mais reforçam a suspeita de depressão bipolar em vez de unipolar?",["Início precoce, hipersonia, hiperfagia, “paralisia de chumbo”, recorrência e pai com TAB","Início antes dos 25 anos, insônia inicial, perda de peso e queixas somáticas","Episódio atual longo, com mais de 6 meses, e história familiar de depressão","Ausência de euforia prévia e sexo feminino"],0,"Pela tabela de depressão bipolar × unipolar, sugerem bipolaridade: início precoce (<25 anos), hipersonia, hiperfagia/ganho de peso, “paralisia de chumbo”, múltiplos episódios anteriores e história familiar de TAB.",["","Insônia inicial, perda de peso e queixas somáticas são sugestivos de depressão unipolar.","Episódio longo (>6 meses) e história familiar de transtorno depressivo sugerem unipolar — e não descrevem esta paciente.","A ausência de euforia até o momento não afasta bipolaridade; por isso se investiga mania/hipomania em todo paciente deprimido."]],
["Depressão","Analisar","Básica","Mulher de 29 anos, deprimida há 1 mês, relata que o humor melhora temporariamente quando recebe boas notícias. Dorme cerca de 12 horas por dia, come muitos doces, descreve braços e pernas “pesados como chumbo” e fica muito abalada com qualquer crítica de colegas.","Qual especificador descreve melhor o episódio depressivo?",["Com características atípicas","Com características melancólicas","Com características psicóticas","Com padrão sazonal"],0,"Características atípicas: reatividade do humor preservada, hiperfagia (desejo por doces), hipersonia, “paralisia de chumbo” e sensibilidade à rejeição interpessoal.",["","Na melancólica há perda da reatividade do humor, piora matinal, despertar precoce e anorexia — o oposto.","Não há delírios nem alucinações.","O padrão sazonal se liga à redução da luz solar (outono/inverno, com melhora na primavera/verão); isso não foi descrito."]],
["Depressão","Compreender","Intermediária","Mulher de 55 anos procura a UBS com humor deprimido, fadiga e letargia há 1 mês. Antes de confirmar transtorno depressivo maior, o médico solicita exames complementares para afastar outra condição médica que explique o quadro.","Qual associação entre exame solicitado e justificativa está correta?",["Creatinina e ureia, pois doenças renais podem mimetizar sintomas depressivos","Hemograma, pois é o principal exame para excluir hipertireoidismo","Colesterol total e frações, pois a dislipidemia causa depressão","Ácido fólico e B12, pois níveis elevados causam sintomas depressivos"],0,"Na tabela de exames de rotina, creatinina e ureia são pedidas porque doenças renais mimetizam sintomas depressivos. O critério C do TDM exige que o episódio não seja atribuível a outra condição médica.",["","O hemograma investiga anemia e infecções (letargia e fadiga); a tireoide se avalia com TSH, T4 livre e T3.","O colesterol é pedido pelo cuidado com ganho de peso, não por ser causa de depressão.","São os níveis baixos de fólico e B12 que podem causar sintomas semelhantes aos da depressão."]],
["Depressão","Analisar","Intermediária","Homem de 58 anos é trazido pela esposa ao pronto-socorro psiquiátrico. Há 6 semanas apresenta tristeza profunda, anedonia, insônia e perda de peso. Afirma com convicção inabalável que levou a família à ruína financeira — o que não é verdade — e que “merece ser punido pelos seus pecados”. Nunca teve sintomas psicóticos fora deste episódio.","Qual é o diagnóstico mais adequado?",["Depressão com características psicóticas","Esquizofrenia","Transtorno esquizoafetivo","Transtorno delirante"],0,"Depressão grave com delírios de culpa e ruína — congruentes com o humor — restritos ao episódio depressivo caracteriza depressão psicótica.",["","Na esquizofrenia a psicose não se restringe ao episódio de humor e a perturbação dura ≥6 meses.","O esquizoafetivo exige ≥2 semanas de delírios ou alucinações sem episódio de humor proeminente.","No transtorno delirante não há um episódio depressivo grave explicando os delírios."]],
["Depressão","Analisar","Básica","Mulher de 38 anos diz na consulta que “sempre foi para baixo”. Há 3 anos passa a maior parte dos dias com humor deprimido leve, cansaço e baixa autoestima, sem nunca ter preenchido critérios para episódio depressivo maior. Nega períodos de euforia, aumento de energia ou redução da necessidade de sono.","Qual é a hipótese diagnóstica mais provável?",["Transtorno depressivo persistente (distimia)","Ciclotimia","Transtorno depressivo maior, episódio único","Transtorno bipolar tipo II"],0,"Humor deprimido crônico, na maior parte do dia e na maioria dos dias, por ≥2 anos, com sintomas mais leves e persistentes que os do episódio depressivo maior, caracteriza distimia.",["","A ciclotimia exige oscilações entre sintomas depressivos e hipomaníacos por ≥2 anos.","Nunca houve período que preenchesse episódio depressivo maior.","TB tipo II exige hipomania e episódio depressivo maior."]],
["Ansiedade","Analisar","Intermediária","Homem de 41 anos, motorista, procura a UBS. Há 10 meses evita ônibus lotados, filas de banco, estádios e shows. Só vai ao mercado acompanhado da esposa e fica perto da saída. Explica: “Se eu passar mal lá dentro, não vou conseguir sair rápido e ninguém vai me socorrer”. Nega medo de ser avaliado ou humilhado e não teme objeto ou animal específico. Faltou ao trabalho algumas vezes por causa disso.","Qual é o diagnóstico mais provável?",["Agorafobia","Fobia específica","Transtorno de ansiedade social","Transtorno de ansiedade generalizada"],0,"O núcleo do medo não é o lugar em si, mas a possibilidade de passar mal e não conseguir escapar ou receber ajuda. Por isso os gatilhos se espalham por vários ambientes (transporte, filas, multidões) e surgem comportamentos de segurança, como a companhia e a proximidade da porta.",["","Na fobia específica o medo é do objeto ou situação em si (voar, alturas, animais, sangue), desproporcional ao perigo real.","No TAS o medo é de ser avaliado negativamente ou humilhado — negado pelo paciente.","No TAG há preocupação excessiva e difusa com diversas circunstâncias, não medo ligado a locais de difícil saída."]],
["Ansiedade","Analisar","Difícil","Mulher de 35 anos, arquiteta, sobe 12 andares de escada todos os dias para não usar o elevador do escritório. Diz ter pavor do elevador em si: imagina o cabo se rompendo e a cabine despencando. Usa metrô, frequenta shoppings e shows sozinha e sem desconforto. Não teme passar mal em locais públicos. O quadro dura 2 anos e tem atrapalhado reuniões em andares altos.","Qual é o diagnóstico mais provável?",["Fobia específica","Agorafobia","Transtorno de ansiedade social","Transtorno do pânico"],0,"Na fobia específica o medo é do próprio objeto ou situação (aqui, o elevador e a queda), desproporcional ao perigo real, com esquiva ativa, duração ≥6 meses e prejuízo. Na agorafobia o local importa pela preocupação de não conseguir escapar ou receber ajuda se passar mal — por isso o medo se generaliza, o que não ocorre aqui.",["","Ela circula sem medo por metrô, shoppings e shows e não teme passar mal sem ajuda — o foco é o elevador em si.","Não há medo de avaliação negativa por outras pessoas.","Não há ataques de pânico inesperados e recorrentes; a ansiedade surge diante de um estímulo específico."]],
["Ansiedade","Avaliar","Difícil","Mulher de 24 anos procura o pronto-atendimento. Nos últimos 2 meses teve três episódios súbitos de palpitação, sudorese, tremor, falta de ar e medo de morrer, com pico em poucos minutos e sem gatilho identificável. Desde então vive preocupada com uma nova crise e deixou a academia com medo de desencadeá-la. Está assintomática na consulta; não usa medicações nem drogas.","Antes de confirmar o diagnóstico de transtorno do pânico, qual conduta é necessária?",["Investigar hipertireoidismo e doença cardiopulmonar como causas dos ataques","Aguardar 6 meses de sintomas para cumprir o critério temporal","Pesquisar evento traumático que explique o início das crises","Aplicar a escala GAD-7 e confirmar com pontuação igual ou maior que 10"],0,"Critérios do transtorno do pânico: ataques recorrentes e inesperados; pelo menos um seguido de preocupação persistente ou mudança mal-adaptativa de comportamento; e ataques não relacionados a substância ou outra condição médica (ex.: hipertireoidismo, distúrbios cardiopulmonares).",["","O critério de 6 meses é do TAG, não do transtorno do pânico.","Evento traumático é exigência do TEPT e do estresse agudo.","A GAD-7 é escala de diagnóstico e monitoramento do TAG, não confirma pânico."]],
["Ansiedade","Analisar","Difícil","Homem de 33 anos, engenheiro, procura a UBS. Há 4 meses se preocupa excessivamente com o trabalho, a saúde dos filhos e o dinheiro, acha difícil controlar a preocupação e tem tensão muscular, irritabilidade e fadiga. Tem faltado a compromissos por isso. Nega crises súbitas de medo e evento traumático. TSH normal.","Qual é a interpretação diagnóstica correta?",["Ainda não preenche TAG, pois o critério exige pelo menos 6 meses","Preenche TAG, pois apresenta 3 dos 6 sintomas associados","Preenche transtorno do pânico, pela preocupação persistente","Preenche TEPT, pela hipervigilância e irritabilidade"],0,"Os demais critérios de TAG estão presentes (≥3 dos 6 sintomas, dificuldade de controle, prejuízo, exclusão clínica), mas falta a duração mínima de 6 meses.",["","O número de sintomas basta, mas o critério temporal não.","Não há ataques de pânico.","Não há evento traumático."]],
["Ansiedade","Aplicar","Intermediária","Estudante de 19 anos procura o ambulatório universitário. Evita apresentar seminários e comer no refeitório; nessas situações tem taquicardia, tremor e rubor, e teme “fazer algo ridículo e todos rirem dela”. Fora desses contextos sente-se bem. O quadro dura 1 ano e já a fez trancar uma disciplina. Exames clínicos normais.","Qual é o diagnóstico e a primeira linha farmacológica, segundo o material?",["Ansiedade social; sertralina, escitalopram ou paroxetina","Agorafobia; clomipramina ou imipramina","Ansiedade social; venlafaxina como primeira opção","Fobia específica; pregabalina ou buspirona"],0,"Medo de avaliação negativa em situações sociais e de desempenho caracteriza TAS. Na tabela, a primeira linha é sertralina, escitalopram ou paroxetina; a venlafaxina fica como segunda linha.",["","O medo é de avaliação, não de ficar sem saída ou ajuda; e clomipramina/imipramina são segunda linha do pânico.","Venlafaxina é segunda linha no TAS.","O estímulo temido é a avaliação social; e pregabalina/buspirona são terceira linha do TAG."]],
["Ansiedade","Compreender","Intermediária","Mulher de 28 anos chega ao pronto-atendimento em crise de ansiedade, com tremor e sensação de desespero. Recebe clonazepam sublingual e, em minutos, relata relaxamento e sonolência. O interno pergunta ao preceptor como o fármaco produz esse efeito.","Qual explicação está correta?",["Potencializa o GABA-A em sítio alostérico, aumentando a entrada de Cl⁻","Abre canais de sódio voltagem-dependentes e despolariza o neurônio","Abre o canal de cloreto mesmo sem GABA, com efeito independente do neurotransmissor","Bloqueia os receptores AMPA e NMDA, impedindo a entrada de cálcio"],0,"O GABA-A é canal ligante-dependente. O benzodiazepínico se liga a um sítio alostérico e não abre o canal sozinho: amplifica o efeito do GABA, aumentando a frequência de abertura, a entrada de cloreto e a hiperpolarização (ansiólise e sedação).",["","Canais de Na⁺ voltagem-dependentes participam da despolarização excitatória; o efeito do BZD é inibitório.","O BZD não funciona sem GABA; abrir o canal sozinho é característica do barbitúrico em dose alta.","AMPA e NMDA são receptores do glutamato, da via excitatória."]],
["Ansiedade","Compreender","Básica","Homem de 36 anos descreve ao médico da UBS uma crise de ansiedade recente, com taquicardia e sudorese. Durante a crise, sentiu que “o mundo ao redor parecia irreal, como um cenário de filme”, embora soubesse quem era e onde estava.","Esse fenômeno psíquico corresponde a:",["Desrealização","Despersonalização","Ideia de referência","Neotimia"],0,"Desrealização é a sensação de irrealidade referida ao ambiente — um dos sintomas psíquicos da ansiedade.",["","Despersonalização é a estranheza referida a si mesmo — ao corpo ou aos próprios pensamentos.","Ideia de referência é atribuir significado pessoal a acontecimentos neutros.","Neotimia é vivenciar sentimentos novos e estranhos, difíceis de nomear."]],
["TOC e TEPT","Analisar","Intermediária","Mulher de 30 anos, bancária, sofreu um sequestro relâmpago há 3 semanas. Desde então tem pesadelos, flashbacks, evita a rua onde aconteceu, está irritável e dorme mal. Procura a UBS porque não consegue voltar ao trabalho. Nega uso de substâncias.","Qual é o diagnóstico e a conduta mais adequados?",["Estresse agudo; acolhimento, psicoterapia breve e acompanhamento","TEPT; TCC com exposição associada a antidepressivo ISRS","Estresse agudo; iniciar ISRS para prevenir evolução para TEPT","Transtorno do pânico; iniciar sertralina e clonazepam SOS"],0,"Sintomas com menos de 1 mês após o trauma configuram estresse agudo. Conduta: acolhimento, psicoterapia breve e acompanhamento. Não há medicação comprovada para prevenir TEPT após o estresse agudo; sintomas e comorbidades são tratados individualmente.",["","O TEPT exige sintomas por pelo menos 1 mês.","Não há medicação comprovada para prevenir TEPT.","Há evento traumático e sintomas de intrusão e esquiva — não são ataques inesperados."]],
["TOC e TEPT","Aplicar","Intermediária","Bombeiro de 40 anos procura a UBS 5 meses após atuar em um incêndio com vítimas. Tem pesadelos e flashbacks, evita notícias sobre incêndios, sente culpa por não ter salvado todos, está distante da família e sem prazer nas atividades. Relata hipervigilância e sobressaltos. Está afastado do trabalho.","Qual é o tratamento indicado?",["TCC com exposição associada a antidepressivo, principalmente ISRS","Benzodiazepínico contínuo como tratamento principal","Antipsicótico em baixa dose como primeira linha","Apenas acolhimento, pois o quadro tende a remitir sozinho"],0,"Intrusão, esquiva, alterações de cognição/humor (culpa, desapego, anedonia) e hiperreatividade por mais de 1 mês fecham TEPT. O tratamento é TCC/exposição + antidepressivos, principalmente ISRS.",["","Benzodiazepínico gera dependência e não é o tratamento de base do TEPT.","Antipsicótico em baixa dose aparece no material como associação no TOC resistente, não no TEPT.","Acolhimento isolado é conduta do estresse agudo, não do TEPT estabelecido."]],
["TOC e TEPT","Compreender","Básica","Mulher de 26 anos procura atendimento porque as mãos estão fissuradas. Conta que tem pensamentos intrusivos e desagradáveis de que as mãos estão contaminadas, o que gera muita ansiedade. Para aliviar, lava as mãos repetidas vezes, somando cerca de 2 horas por dia. Sabe que é exagerado, mas não consegue parar.","No modelo do TOC, o comportamento de lavar as mãos representa:",["Compulsão, que alivia a ansiedade temporariamente e mantém o ciclo","Obsessão, que é o pensamento intrusivo gerador de ansiedade","Tique motor, involuntário e sem relação com a ansiedade","Comportamento de busca de prazer e recompensa"],0,"A obsessão é o pensamento intrusivo (contaminação); a compulsão é o ritual feito para aliviar a ansiedade. O alívio é temporário, a obsessão volta e o ciclo se mantém. Gastar ≥1 hora por dia é um dos critérios.",["","A obsessão é o pensamento de contaminação, não o ato de lavar.","O tique é involuntário e estereotipado; a lavagem é ritual para neutralizar a ansiedade.","A compulsão não dá prazer — dá alívio temporário."]],
["TOC e TEPT","Avaliar","Difícil","Homem de 30 anos, com TOC grave (checagens que consomem 4 horas por dia), usa sertralina 100 mg há 6 semanas, associada a TCC com exposição e prevenção de resposta. Relata melhora mínima e pergunta se o remédio “não está funcionando”. Tolera bem a medicação.","Qual é a conduta mais adequada?",["Titular o ISRS até a dose máxima tolerada e aguardar cerca de 4 meses","Suspender a sertralina por falha terapêutica","Substituir a sertralina por clonazepam contínuo","Interromper a exposição e prevenção de resposta"],0,"No TOC, o ISRS costuma precisar de dose máxima (às vezes acima dela, off-label) e a resposta leva cerca de 4 meses — bem mais que as 2–4 semanas da depressão ou do TAG. Suspender antes disso é erro clássico.",["","Seis semanas é pouco tempo para avaliar resposta no TOC.","Benzodiazepínico não é tratamento do TOC e gera dependência.","A TCC com EPR é primeira linha no TOC, junto com o ISRS."]],
["TOC e TEPT","Avaliar","Difícil","Adolescente de 17 anos com TOC e tiques motores e vocais desde a infância (Tourette) é acompanhado no ambulatório. Mantém obsessões e compulsões incapacitantes após ISRS em dose máxima por 4 meses e TCC com exposição e prevenção de resposta, com boa adesão.","Qual é a conduta mais adequada?",["Associar antipsicótico em baixa dose, como risperidona ou aripiprazol","Substituir o ISRS por benzodiazepínico contínuo","Suspender o ISRS, pois TOC com tiques não responde a ele","Rever o diagnóstico, pois tiques excluem TOC"],0,"Na resistência ao tratamento do TOC, associa-se antipsicótico em baixa dose (risperidona, aripiprazol ou haloperidol). O DSM-5-TR prevê especificar TOC associado a tiques, e a sobreposição Tourette + TOC tende a ser mais difícil de tratar.",["","Benzodiazepínico não entra no tratamento do TOC resistente.","O ISRS continua sendo a base; o antipsicótico entra como associação.","O DSM-5-TR inclui o especificador “associado a tiques” — os dois coexistem."]],
["Esquizofrenia","Analisar","Intermediária","Homem de 21 anos é levado pela família ao CAPS. Há 4 meses ouve vozes que comentam suas ações e acredita estar sendo vigiado pelos vizinhos por câmeras; abandonou o emprego. Rastreio toxicológico negativo, exames clínicos normais e sem sintomas de mania ou depressão.","Qual é o diagnóstico mais provável?",["Transtorno esquizofreniforme","Esquizofrenia","Transtorno psicótico breve","Transtorno delirante"],0,"Critério A presente, com duração entre 1 e 6 meses: transtorno esquizofreniforme. Se passar de 6 meses, reclassifica-se como esquizofrenia — a distinção é puramente temporal.",["","A esquizofrenia exige ≥6 meses de perturbação contínua.","O transtorno psicótico breve dura menos de 1 mês.","No transtorno delirante não há alucinações proeminentes e o funcionamento fora do delírio é preservado."]],
["Esquizofrenia","Analisar","Difícil","Mulher de 34 anos, acompanhada há 5 anos, teve vários episódios maníacos que ocupam a maior parte do curso da doença. Há 1 ano, porém, apresentou 3 semanas de alucinações auditivas e delírios persecutórios com humor eutímico, confirmados pela família e pela equipe. Rastreio toxicológico negativo.","Qual é o diagnóstico mais provável?",["Transtorno esquizoafetivo","Transtorno bipolar com características psicóticas","Esquizofrenia","Psicose induzida por substância"],0,"O ponto-chave é a psicose isolada por ≥2 semanas, sem episódio de humor, somada a episódios de humor dominando a maior parte do curso: transtorno esquizoafetivo.",["","No bipolar com psicose, os sintomas psicóticos ficam restritos aos episódios de humor.","Na esquizofrenia, os episódios de humor não dominam a maior parte do curso.","O rastreio toxicológico é negativo e não há relação com uso ou abstinência."]],
["Esquizofrenia","Analisar","Difícil","Homem de 24 anos é avaliado no ambulatório. Há 8 meses apresenta isolamento social, embotamento afetivo, avolição e episódios de comportamento catatônico. Não há delírios, alucinações nem discurso desorganizado. Exames clínicos e toxicológico normais.","Em relação ao critério A da esquizofrenia (DSM-5-TR), é correto afirmar que:",["Não é preenchido, pois falta delírio, alucinação ou discurso desorganizado","É preenchido, pois há dois ou mais sintomas do critério A","É preenchido, pois a perturbação dura mais de 6 meses","É preenchido, pois sintomas negativos isolados bastam com prejuízo"],0,"O critério A pede ≥2 dos 5 sintomas, sendo ao menos um “core” (delírio, alucinação ou discurso desorganizado). Sintomas negativos e comportamento catatônico, isolados, não bastam.",["","Dois sintomas não bastam se nenhum deles for core.","A duração é o critério C; não substitui o critério A.","Sintomas negativos isolados não preenchem o critério A."]],
["Esquizofrenia","Aplicar","Intermediária","Homem de 29 anos, com esquizofrenia há 6 anos, mantém alucinações auditivas e delírios persecutórios graves. Usou risperidona e, depois, olanzapina, ambas em dose adequada por mais de 6 semanas; a adesão foi confirmada pela família e por dosagens. Não usa substâncias.","Qual é a próxima conduta mais adequada?",["Iniciar clozapina com titulação lenta e hemograma basal e seriado","Associar haloperidol à olanzapina de forma indefinida","Substituir por aripiprazol, por ser primeira linha","Suspender os antipsicóticos e observar a evolução"],0,"Falha a ≥2 antipsicóticos em dose e tempo adequados, com adesão confirmada, define esquizofrenia refratária. A clozapina é o padrão-ouro, com titulação lenta e hemograma obrigatório pelo risco de agranulocitose.",["","Potencialização com outro antipsicótico é estratégia para resposta parcial à clozapina, não substituta dela.","Após falha de dois antipsicóticos, a regra prática do material é clozapina.","Suspender expõe o paciente a piora; o quadro exige clozapina."]],
["Esquizofrenia","Aplicar","Básica","Homem de 26 anos, com esquizofrenia, iniciou um antipsicótico há 3 meses e teve boa resposta dos sintomas positivos. Retorna à UBS queixando-se de aumento das mamas, saída de secreção pelo mamilo e disfunção sexual. Não usa outras medicações.","Qual antipsicótico é o responsável mais provável?",["Risperidona","Quetiapina","Aripiprazol","Clozapina"],0,"Ginecomastia, galactorreia e disfunção sexual refletem hiperprolactinemia, efeito proeminente da risperidona (e da paliperidona).",["","A quetiapina tem menor risco de prolactina; destaca-se por sedação e hipotensão ortostática.","O aripiprazol tem baixo risco de hiperprolactinemia; destaca-se pela acatisia.","A clozapina se associa a agranulocitose, miocardite, convulsões e sialorreia."]],
["Esquizofrenia","Avaliar","Intermediária","Mulher de 23 anos é atendida no CAPS em primeiro episódio psicótico, com diagnóstico de esquizofrenia confirmado. Tem IMC de 33 kg/m², glicemia de jejum limítrofe e história familiar de diabetes. A família pede um tratamento que “não faça engordar”.","Qual antipsicótico é o mais adequado?",["Aripiprazol","Olanzapina","Clozapina","Haloperidol"],0,"O aripiprazol é frequentemente recomendado como primeira linha no primeiro episódio pelo perfil metabólico favorável — ideal para paciente com risco metabólico. Deve-se monitorar acatisia e insônia.",["","A olanzapina causa ganho de peso significativo e síndrome metabólica.","A clozapina é reservada à esquizofrenia refratária.","O haloperidol é típico, com alto risco de EPS e discinesia tardia; a primeira linha é atípico."]],
["Esquizofrenia","Analisar","Difícil","Homem de 30 anos, com esquizofrenia, usa haloperidol há 4 meses com boa adesão. Delírios e alucinações praticamente desapareceram, mas persistem embotamento afetivo, pobreza do discurso, dificuldade de concentração e de planejamento. A mãe pergunta por que o remédio “só resolveu metade”.","Qual explicação fisiopatológica justifica essa resposta?",["Positivos vêm da hiperdopaminergia mesolímbica; negativos e cognitivos, de disfunção cortical","Negativos vêm de excesso de dopamina mesocortical, que o bloqueio D2 aumenta","Negativos e cognitivos são sempre depressão associada, não esquizofrenia","O bloqueio D2 age apenas na via mesocortical, poupando a mesolímbica"],0,"Hiperatividade dopaminérgica mesolímbica explica os sintomas positivos; hipofunção na via mesocortical e disfunção glutamatérgica/GABAérgica cortical explicam negativos e cognitivos — pouco sensíveis ao bloqueio D2.",["","Na via mesocortical há hipoatividade, não excesso de dopamina.","Sintomas negativos são domínio próprio da esquizofrenia; diferenciá-los de depressão é justamente um ponto de prova.","O bloqueio D2 melhora os sintomas positivos, ligados à via mesolímbica."]],
["Esquizofrenia","Analisar","Intermediária","Homem de 50 anos, contador, é trazido pela esposa. Há 2 anos tem convicção inabalável de que ela o trai, sem qualquer evidência, e revisa o celular dela todos os dias. Trabalha normalmente e mantém o autocuidado. Não tem alucinações proeminentes, discurso desorganizado ou sintomas negativos; nega sintomas de humor.","Qual é o diagnóstico mais provável?",["Transtorno delirante","Esquizofrenia","Transtorno esquizofreniforme","Depressão com características psicóticas"],0,"Delírio por ≥1 mês, com funcionamento preservado fora do tema delirante e sem alucinações proeminentes, desorganização ou sintomas negativos, caracteriza transtorno delirante.",["","A esquizofrenia exige ≥2 sintomas do critério A e prejuízo funcional marcante.","O esquizofreniforme exige critério A e dura de 1 a 6 meses.","Não há episódio depressivo."]],
["Corrimento vaginal","Aplicar","Básica","Mulher de 28 anos procura a UBS com corrimento acinzentado, fino e homogêneo, com odor de “peixe podre” que piora após a relação sexual. Nega prurido. Ao exame especular, paredes vaginais sem eritema. pH vaginal 5,0; teste das aminas positivo; clue cells no exame a fresco. Não está grávida.","Qual é a conduta mais adequada?",["Metronidazol 500 mg VO de 12/12 h por 7 dias, sem tratar o parceiro","Metronidazol 2 g VO em dose única para ela e o parceiro","Fluconazol 150 mg VO em dose única","Ceftriaxona 500 mg IM associada a doxiciclina"],0,"Vaginose bacteriana (Amsel preenchido). Primeira opção: metronidazol 250 mg, 2 comprimidos de 12/12 h por 7 dias. O parceiro não é tratado (não reduz recorrência), e deve-se orientar abstinência de álcool durante o uso e por 24 h após.",["","Na VB não se trata o parceiro; a dose única de 2 g é esquema da tricomoníase.","Fluconazol trata candidíase, que tem pH normal e teste das aminas negativo.","Ceftriaxona e doxiciclina tratam cervicite por gonococo e clamídia."]],
["Corrimento vaginal","Aplicar","Intermediária","Gestante de 24 semanas procura a UBS com prurido vulvar intenso, ardor e corrimento branco, grumoso, aderido às paredes vaginais e sem odor. Ao exame, eritema e edema vulvar e colo uterino normal. pH 4,2; teste das aminas negativo; pseudo-hifas no exame com KOH. O parceiro é assintomático.","Qual é a conduta mais adequada?",["Miconazol creme vaginal 2% por 7 dias","Fluconazol 150 mg VO em dose única","Metronidazol gel vaginal por 5 dias","Fluconazol para a gestante e para o parceiro"],0,"Candidíase vulvovaginal. Na gestação, o tratamento é apenas tópico (azólicos); o fluconazol oral deve ser evitado. O parceiro só é tratado se sintomático.",["","Fluconazol oral deve ser evitado na gestação.","Metronidazol trata VB e tricomoníase, não candidíase.","Fluconazol oral é evitado na gestação, e o parceiro assintomático não é tratado."]],
["Corrimento vaginal","Avaliar","Intermediária","Mulher de 30 anos procura a UBS com corrimento abundante, amarelo-esverdeado, bolhoso e fétido, além de disúria e dispareunia. Ao exame especular, colo com pontilhado hemorrágico (“em framboesa”). pH 6,0; protozoários flagelados móveis no exame a fresco. Tem parceiro fixo, assintomático.","Qual é a conduta mais adequada?",["Metronidazol VO por 7 dias, tratar o parceiro e retestar em 3 meses","Metronidazol gel vaginal por 5 dias, sem tratar o parceiro","Clindamicina creme vaginal por 7 dias e reavaliação","Fluconazol 150 mg a cada 72 horas, em 3 doses"],0,"Tricomoníase é IST: tratamento sistêmico (em mulheres, metronidazol 7 dias é superior à dose única), parceiro sempre tratado, mesmo assintomático, e reteste em 3 meses.",["","A via vaginal não erradica a tricomoníase: o protozoário coloniza uretra e glândulas parauretrais. E o parceiro deve ser sempre tratado.","Clindamicina é alternativa para VB, não para tricomoníase.","Fluconazol trata candidíase."]],
["Corrimento vaginal","Analisar","Difícil","Mulher de 32 anos retorna à UBS com prurido intenso e corrimento branco grumoso que pioram na semana anterior à menstruação. Já usou fluconazol várias vezes, sem melhora. pH 3,5; teste das aminas negativo; microscopia com núcleos celulares rompidos, muitos lactobacilos, poucos leucócitos e ausência de hifas.","Qual é a conduta mais adequada?",["Bicarbonato de sódio em ducha vaginal por 2 semanas","Fluconazol 150 mg semanal por 6 meses","Estradiol creme vaginal","Clindamicina creme vaginal 2% por 14 dias"],0,"Vaginose citolítica: excesso de lactobacilos, pH <3,8 e citólise, com piora pré-menstrual e falha de antifúngico. A conduta é alcalinizar o meio com bicarbonato.",["","Insistir em antifúngico na citolítica é pegadinha: não há fungo.","Estrogênio tópico trata a vaginite atrófica, de pH elevado.","Clindamicina creme por 14 dias faz parte do tratamento da vaginite descamativa (pH >6)."]],
["Corrimento vaginal","Avaliar","Difícil","Gestante de 20 anos, com parceiro novo há 2 meses, procura a UBS por sangramento após relação sexual. Não percebe corrimento. Ao exame especular, secreção mucopurulenta saindo do orifício externo do colo, que sangra ao toque do swab. Sem dor abdominal, sem dor à mobilização do colo, afebril. NAAT colhido; clamídia não excluída.","Qual é a conduta mais adequada?",["Ceftriaxona 500 mg IM + azitromicina 1 g VO; tratar parceiros dos últimos 60 dias","Ceftriaxona 500 mg IM + doxiciclina 100 mg de 12/12 h por 7 dias","Aguardar o surgimento de corrimento vaginal para então tratar","Internar para antibioticoterapia de amplo espectro por DIP"],0,"Cervicite (colo friável, secreção endocervical mucopurulenta). Gonococo: ceftriaxona, segura na gestação. Com clamídia não excluída, a azitromicina substitui a doxiciclina, contraindicada na gestação. Parceiros dos últimos 60 dias são tratados.",["","A doxiciclina é contraindicada na gestação.","A cervicite muitas vezes não gera corrimento perceptível; esperar arrisca evolução para DIP.","Não há dor abdominal, dor à mobilização do colo nem febre — sinais que apontariam para DIP."]],
["Corrimento vaginal","Aplicar","Intermediária","Mulher de 26 anos é atendida em UBS sem acesso a bacterioscopia pelo Gram. Apresenta corrimento acinzentado, fino e homogêneo; pH vaginal 5,0; teste das aminas positivo; clue cells em 25% das células epiteliais no exame a fresco. A médica residente questiona se é possível firmar o diagnóstico sem o laboratório.","Qual afirmação sobre o diagnóstico da vaginose bacteriana está correta?",["Amsel está preenchido; Nugent (Gram, 7–10) é o padrão-ouro, mas não é obrigatório","O diagnóstico depende do escore de Nugent, pois Amsel exige os 4 critérios","A cultura para Gardnerella é o exame de rotina para confirmar o diagnóstico","Nugent de 4 a 6 seria suficiente para confirmar a vaginose bacteriana"],0,"Amsel é o critério clínico prático de consultório: 3 de 4 (corrimento característico, pH ≥4,5, teste das aminas positivo, clue cells ≥20%) — aqui, os 4. Nugent pontua morfotipos no Gram (0–3 normal; 4–6 intermediário; 7–10 VB) e é o padrão-ouro laboratorial.",["","Amsel exige 3 de 4 critérios e é suficiente no consultório.","Cultura não é rotina na VB, porque a Gardnerella está presente mesmo em mulheres saudáveis.","Nugent 4–6 indica flora intermediária."]],
["Corrimento vaginal","Aplicar","Básica","Menina de 6 anos é levada pela mãe à UBS por corrimento amarelado, fétido, às vezes sanguinolento, persistente há 3 semanas. Ao exame, identifica-se um fragmento de papel higiênico no introito vaginal, que é retirado.","Além da retirada do corpo estranho, qual conduta é obrigatória?",["Descartar abuso sexual","Prescrever metronidazol oral empírico","Prescrever estrogênio tópico","Orientar higiene local e dar alta"],0,"Na vaginite por corpo estranho, a conduta inclui retirada do objeto e orientações de higiene — e descartar abuso sexual é item obrigatório.",["","Não há indicação de antimicrobiano; o tratamento é a retirada do corpo estranho.","Estrogênio tópico é o tratamento da vaginite atrófica.","Orientar higiene faz parte, mas encerrar sem descartar abuso sexual é erro de conduta."]],
["Corrimento vaginal","Aplicar","Intermediária","Mulher de 61 anos, na pós-menopausa, procura a UBS com secura vaginal, dispareunia e disúria. Refere corrimento escasso, amarelado e sem odor fétido. Ao exame, epitélio vaginal fino, pálido e friável. pH 5,0; teste das aminas negativo; microscopia com muitas células parabasais e poucos lactobacilos. Sem contraindicação a estrogênio.","Qual é a conduta mais adequada?",["Estradiol creme vaginal","Metronidazol VO por 7 dias","Clindamicina creme 2% associada a hidrocortisona vaginal","Bicarbonato de sódio em ducha vaginal"],0,"Vaginite atrófica: pouco estrogênio → pouco glicogênio → poucos lactobacilos → pH 4,5–5, com aumento de células parabasais. O tratamento é estrogênio tópico; se contraindicado, laser, lubrificantes e hidratantes.",["","O pH alto vem do hipoestrogenismo; não há odor fétido, teste das aminas positivo nem clue cells.","Clindamicina + hidrocortisona trata a vaginite descamativa (pH >6, corrimento purulento).","Bicarbonato alcaliniza o meio e trata a citolítica — pioraria um meio já alcalino."]]
];
const $=id=>document.getElementById(id),L="ABCD";
let order,perm,ans,pos;
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const correct=()=>Object.entries(ans).filter(([k,v])=>Q[k][6]===v).length;
function start(){order=sh(Q.map((_,i)=>i));perm=Q.map(q=>sh(q[5].map((_,i)=>i)));ans={};pos=0;
$("quiz").classList.remove("hide");$("result").classList.add("hide");$("review").classList.add("hide");render()}
function block(qi,chosen,num){const q=Q[qi],p=perm[qi],done=chosen!==undefined;
let h=`<p class="qn">Questão ${num}</p><p class="stem">${esc(q[3])}</p><p class="cmd">${esc(q[4])}</p><div class="opts">`;
p.forEach((oi,k)=>{let c="";if(done){if(oi===q[6])c=" ok";else if(oi===chosen)c=" no"}
h+=`<button class="opt${c}" data-o="${oi}"${done?" disabled":""}><span class="l">${L[k]}</span><span>${esc(q[5][oi])}</span></button>`});
h+="</div>";
if(done){const ok=chosen===q[6];
h+=`<div class="fb" aria-live="polite"><p class="verdict ${ok?"ok":"no"}">${ok?"Resposta correta":"Resposta incorreta"}</p><h3>Resposta</h3><p>Alternativa <b>${L[p.indexOf(q[6])]}</b></p><h3>Explicação</h3><p>${esc(q[7])}</p><h3>Por que as outras estão erradas</h3><ul>`;
p.forEach((oi,k)=>{if(oi!==q[6])h+=`<li><b>${L[k]})</b> ${esc(q[8][oi])}</li>`});
h+=`</ul></div>`}
return h}
function render(){const qi=order[pos],c=$("card");c.innerHTML=block(qi,ans[qi],pos+1);
c.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>{ans[qi]=+b.dataset.o;render()});
const n=Object.keys(ans).length,h=correct();
$("cur").textContent=pos+1;$("hit").textContent=h;$("err").textContent=n-h;$("prog").style.width=n*2+"%";
$("prev").disabled=pos===0;$("next").textContent=pos===Q.length-1?"Ver resultado":"Próxima questão";$("next").disabled=ans[qi]===undefined;
$("foot").textContent=`${n} de 50 respondidas`}
$("prev").onclick=()=>{if(pos>0){pos--;render();scrollTo(0,0)}};
$("next").onclick=()=>{if(pos<Q.length-1){pos++;render();scrollTo(0,0)}else finish()};
function tally(col){const t={};Q.forEach((q,i)=>{const k=q[col];t[k]=t[k]||[0,0];t[k][1]++;if(ans[i]===q[6])t[k][0]++});
return Object.entries(t).map(([k,[a,b]])=>`<tr><td>${k}</td><td>${a} de ${b}</td></tr>`).join("")}
function finish(){const n=Object.keys(ans).length,h=correct(),e=n-h;
$("quiz").classList.add("hide");$("review").classList.add("hide");const r=$("result");r.classList.remove("hide");
r.innerHTML=`<div class="card res"><h2>Resultado</h2><p style="color:var(--muted);margin:0">Aproveitamento sobre as 50 questões</p><p class="big">${Math.round(h/Q.length*100)}%</p><div class="grid"><div><span>Acertos</span><b>${h}</b></div><div><span>Erros</span><b>${e}</b></div><div><span>Respondidas</span><b>${n}</b></div></div><h3>Acertos por nível de Bloom</h3><table class="tb">${tally(1)}</table><h3>Acertos por tema</h3><table class="tb">${tally(0)}</table><div class="row"><button class="btn pri" id="rv"${e?"":" disabled"}>Revisar erros</button><button class="btn" id="rd">Refazer quiz</button></div></div>`;
$("rv").onclick=review;$("rd").onclick=start;$("foot").textContent="";scrollTo(0,0)}
function review(){const w=order.filter(qi=>ans[qi]!==undefined&&ans[qi]!==Q[qi][6]),r=$("review");
r.innerHTML=`<div class="row" style="margin:0 0 16px"><button class="btn" id="bk">Voltar ao resultado</button><button class="btn pri" id="rd2">Refazer quiz</button></div>`+w.map(qi=>`<article class="card">${block(qi,ans[qi],order.indexOf(qi)+1)}</article>`).join("");
$("result").classList.add("hide");r.classList.remove("hide");$("bk").onclick=finish;$("rd2").onclick=start;scrollTo(0,0)}
$("reset").onclick=()=>{if(confirm("Reiniciar o quiz? As respostas atuais serão perdidas."))start()};
$("theme").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;d.dataset.theme=dark?"light":"dark"};
document.addEventListener("keydown",e=>{if($("quiz").classList.contains("hide"))return;const k=e.key.toUpperCase(),i=L.indexOf(k);
if(i>-1&&k.length===1){const b=$("card").querySelectorAll(".opt:not(:disabled)")[i];if(b)b.click()}
else if(e.key==="ArrowRight"&&!$("next").disabled)$("next").click();else if(e.key==="ArrowLeft")$("prev").click()});
start();
</script>
</body>
</html>
